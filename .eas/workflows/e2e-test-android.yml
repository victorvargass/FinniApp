name: E2E Android

jobs:
  build_android_for_e2e:
    name: Build Android E2E APK
    type: build
    params:
      platform: android
      profile: e2e-test

  maestro_test:
    name: Run FinniApp E2E
    needs: [build_android_for_e2e]
    type: maestro
    params:
      build_id: ${{ needs.build_android_for_e2e.outputs.build_id }}
      flow_path: ['.maestro/onboarding-full.yml', '.maestro/smoke-financial.yml', '.maestro/settings-and-localization.yml', '.maestro/google-drive-boundary.yml']
      retries: 1
      retry_failed_only: true
      record_screen: true
