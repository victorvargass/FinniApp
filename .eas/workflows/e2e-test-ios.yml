name: E2E iOS Simulator

jobs:
  build_ios_for_e2e:
    name: Build iOS simulator candidate
    type: build
    params:
      platform: ios
      profile: e2e-test

  maestro_test:
    name: Run FinniApp critical iOS journeys
    needs: [build_ios_for_e2e]
    type: maestro
    params:
      build_id: ${{ needs.build_ios_for_e2e.outputs.build_id }}
      flow_path: ['.maestro/onboarding-full.yml', '.maestro/smoke-financial.yml', '.maestro/debt-partial-payment.yml', '.maestro/credit-installment-reconciliation.yml', '.maestro/settings-and-localization.yml']
      retries: 1
      retry_failed_only: true
      record_screen: true
