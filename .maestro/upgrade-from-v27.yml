appId: com.vitoco18.FinniApp
name: FinniApp upgrades a populated v27 database
---
- launchApp
- extendedWaitUntil:
    visible: 'Bienvenido a FinniApp'
    timeout: 120000
- tapOn:
    id: 'onboarding-skip'
- extendedWaitUntil:
    visible: 'Período actual'
    timeout: 30000

# Los movimientos anteriores sobreviven a la inicialización y migración real.
- tapOn:
    id: 'tab-movements'
- tapOn: 'Buscar por nombre...'
- inputText: 'Compra migrada QA'
- extendedWaitUntil:
    visible: 'Compra migrada QA'
    timeout: 30000
- assertVisible: 'Compra migrada QA'
- hideKeyboard

# Gastos e ingresos viven en pestañas distintas dentro de Movimientos.
- tapOn: 'Ingresos'
- tapOn: 'Buscar por nombre...'
- inputText: 'Ingreso migrado QA'
- extendedWaitUntil:
    visible: 'Ingreso migrado QA'
    timeout: 30000
- assertVisible: 'Ingreso migrado QA'
- hideKeyboard

# También sobreviven datos de los dominios que suelen romper una migración.
- tapOn:
    id: 'tab-user'
- scrollUntilVisible:
    element:
      text: 'Metas de ahorro'
    direction: UP
    visibilityPercentage: 50
    timeout: 30000
- tapOn: 'Gestionar metas de ahorro'
- assertVisible: 'Meta migrada QA'
- back
- scrollUntilVisible:
    element:
      text: 'Deudas y pagos'
    direction: UP
    visibilityPercentage: 50
    timeout: 30000
- tapOn: 'Gestionar deudas y cuotas'
- tapOn: 'Préstamos y otras deudas'
- assertVisible: 'Deuda migrada QA'
- back
- scrollUntilVisible:
    element:
      text: 'Movimientos recurrentes'
    direction: UP
    visibilityPercentage: 50
    timeout: 30000
- tapOn: 'Configurar movimientos recurrentes'
- tapOn: 'Gastos'
- assertVisible: 'Recurrencia migrada QA'
- takeScreenshot: 'finniapp-upgrade-v27'
