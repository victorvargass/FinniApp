appId: com.vitoco18.FinniApp
name: FinniApp contact debt and partial payment
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: 'Bienvenido a FinniApp'
    timeout: 20000
- tapOn:
    id: 'onboarding-skip'
- extendedWaitUntil:
    visible: 'Período actual'
    timeout: 20000

# Crea el contacto que se asociará a la deuda.
- tapOn:
    id: 'tab-user'
- scrollUntilVisible:
    element:
      text: 'Grupos y categorías'
    direction: DOWN
    visibilityPercentage: 50
    timeout: 30000
- tapOn: 'Grupos y categorías'
- tapOn: 'Contactos y parentescos'
- tapOn: 'Nuevo contacto'
- tapOn:
    id: 'contact-name-input'
- inputText: 'Contacto E2E'
- tapOn:
    id: 'contact-nickname-input'
- inputText: 'QA'
- hideKeyboard
- scrollUntilVisible:
    element:
      id: 'contact-save'
    direction: DOWN
    visibilityPercentage: 80
    timeout: 30000
- tapOn:
    id: 'contact-save'
- extendedWaitUntil:
    visible: 'Contacto E2E'
    timeout: 15000

# Crea una deuda en cuotas asociada a ese contacto.
- back
- back
- scrollUntilVisible:
    element:
      text: 'Deudas y pagos'
    direction: DOWN
    visibilityPercentage: 50
    timeout: 30000
- tapOn: 'Gestionar deudas y cuotas'
- tapOn: 'Préstamos y otras deudas'
- tapOn: 'Nueva deuda'
- tapOn:
    id: 'debt-name-input'
- inputText: 'Prestamo E2E'
- tapOn:
    id: 'debt-contact-select'
- tapOn: 'Contacto E2E.*'
- hideKeyboard
- scrollUntilVisible:
    element:
      id: 'debt-initial-amount-input'
    direction: DOWN
    visibilityPercentage: 60
    timeout: 30000
- tapOn:
    id: 'debt-initial-amount-input'
- inputText: '60000'
- hideKeyboard
- scrollUntilVisible:
    element:
      id: 'debt-installment-amount-input'
    direction: DOWN
    visibilityPercentage: 60
    timeout: 30000
- tapOn:
    id: 'debt-installment-amount-input'
- inputText: '20000'
- hideKeyboard
- scrollUntilVisible:
    element:
      id: 'debt-save'
    direction: DOWN
    visibilityPercentage: 80
    timeout: 30000
- tapOn:
    id: 'debt-save'
- extendedWaitUntil:
    visible: 'Prestamo E2E'
    timeout: 15000

# Un pago parcial debe conservar la deuda y recalcular el saldo.
- tapOn: 'Prestamo E2E'
- assertVisible: '$60.000'
- tapOn: 'Más opciones'
- tapOn: 'Registrar pago'
- tapOn:
    id: 'debt-payment-amount-input'
- eraseText: 30
- inputText: '15000'
- hideKeyboard
- scrollUntilVisible:
    element:
      id: 'debt-payment-save'
    direction: DOWN
    visibilityPercentage: 80
    timeout: 30000
- tapOn:
    id: 'debt-payment-save'
- extendedWaitUntil:
    visible: '$45.000'
    timeout: 15000
- assertVisible: '$15.000'
- assertVisible: 'Activa'
- takeScreenshot: 'finniapp-debt-partial-payment'
