appId: com.vitoco18.FinniApp
name: FinniApp financial smoke test
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: 'Bienvenido a FinniApp'
    timeout: 20000
- tapOn:
    id: 'onboarding-skip'
- extendedWaitUntil:
    visible: 'Período actual'
    timeout: 20000

# Los módulos secundarios deben abrir correctamente aun sin datos ficticios.
- tapOn:
    id: 'tab-user'
- scrollUntilVisible:
    element:
      text: 'Deudas y cuotas'
    direction: UP
    visibilityPercentage: 50
    timeout: 30000
- tapOn: 'Gestionar deudas y cuotas'
- assertVisible: 'Todavía no tienes deudas'
- back
- scrollUntilVisible:
    element:
      text: 'Metas de ahorro'
    direction: UP
    visibilityPercentage: 50
    timeout: 30000
- tapOn: 'Gestionar metas de ahorro'
- assertVisible: 'Aún no tienes metas activas'
- back
- scrollUntilVisible:
    element:
      text: 'Movimientos recurrentes'
    direction: UP
    visibilityPercentage: 50
    timeout: 30000
- tapOn: 'Configurar movimientos recurrentes'
- assertVisible: 'Programa tu primer ingreso'
- back
- scrollUntilVisible:
    element:
      text: 'Medios de pago'
    direction: UP
    visibilityPercentage: 50
    timeout: 30000
- tapOn: 'Configurar medios de pago'
- assertVisible: 'Efectivo'
- back

# El botón global + permite crear un gasto, editarlo y eliminarlo.
- tapOn:
    id: 'tab-add-movement'
- assertVisible: '¿Qué deseas registrar?'
- tapOn: 'Nuevo gasto'
- tapOn:
    id: 'expense-name-input'
- inputText: 'Compra E2E'
- tapOn:
    id: 'expense-amount-input'
- inputText: '12500'
- hideKeyboard
- tapOn:
    id: 'expense-save'
- extendedWaitUntil:
    visible: 'Compra E2E'
    timeout: 15000
- tapOn: 'Compra E2E'
- tapOn:
    id: 'expense-name-input'
- eraseText: 50
- inputText: 'Compra E2E editada'
- hideKeyboard
- tapOn:
    id: 'expense-save'
- extendedWaitUntil:
    visible: 'Compra E2E editada'
    timeout: 15000
- tapOn: 'Acciones para Compra E2E editada'
- assertVisible: 'Selecciona qué deseas hacer'
- tapOn: 'Eliminar'
- assertVisible: '¿Eliminar "Compra E2E editada"?'
- tapOn: 'Eliminar'
- assertNotVisible: 'Compra E2E editada'

# El mismo botón global + permite crear y eliminar un ingreso.
- tapOn:
    id: 'tab-add-movement'
- assertVisible: '¿Qué deseas registrar?'
- tapOn: 'Nuevo ingreso'
- tapOn:
    id: 'income-name-input'
- inputText: 'Ingreso E2E'
- tapOn:
    id: 'income-amount-input'
- inputText: '45000'
- hideKeyboard
- tapOn:
    id: 'income-save'
- extendedWaitUntil:
    visible: 'Ingreso E2E'
    timeout: 15000
- tapOn: 'Acciones para Ingreso E2E'
- assertVisible: 'Selecciona qué deseas hacer'
- tapOn: 'Eliminar'
- assertVisible: '¿Eliminar "Ingreso E2E"?'
- tapOn: 'Eliminar'
- assertNotVisible: 'Ingreso E2E'

# Deja un movimiento real para comprobar que el cierre acepta gasto O ingreso.
- tapOn:
    id: 'tab-add-movement'
- tapOn: 'Nuevo gasto'
- tapOn:
    id: 'expense-name-input'
- inputText: 'Movimiento para cierre'
- tapOn:
    id: 'expense-amount-input'
- inputText: '1000'
- hideKeyboard
- tapOn:
    id: 'expense-save'
- extendedWaitUntil:
    visible: 'Movimiento para cierre'
    timeout: 15000

# Con un solo gasto, cerrar período debe estar habilitado.
- tapOn:
    id: 'tab-home'
- scrollUntilVisible:
    element:
      id: 'period-close'
    direction: DOWN
    visibilityPercentage: 50
    timeout: 30000
- tapOn:
    id: 'period-close'
- assertVisible: 'Finalizar período actual'
- assertVisible: 'Finalizar y continuar'
- tapOn: 'Cancelar'
- takeScreenshot: 'finniapp-financial-smoke'
