name: Android E2E

on:
  workflow_call:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: android-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.14.0
          cache: npm
      - run: npm ci
      - name: Generate Android project
        run: npx expo prebuild --platform android --no-install
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Build E2E APK
        working-directory: android
        run: ./gradlew :app:assembleDebug
      - name: Install Maestro
        env:
          MAESTRO_VERSION: 1.40.3
        run: curl -Ls https://get.maestro.mobile.dev | bash
      - name: Enable KVM acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run critical journeys on Android 15
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          disable-linux-hw-accel: false
          script: bash scripts/run-android-e2e.sh
      - name: Verify critical journeys completed
        if: always()
        run: |
          if [[ ! -f "$RUNNER_TEMP/finniapp-maestro-passed" ]]; then
            echo "::error::Maestro or the Android emulator failed before all critical journeys completed."
            exit 1
          fi
      - name: Upload Maestro evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: maestro-android-${{ github.run_id }}
          path: |
            ~/.maestro/tests
            ${{ runner.temp }}/metro.log
          if-no-files-found: ignore
          retention-days: 14
