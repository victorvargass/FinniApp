name: Android E2E

on:
  workflow_call:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: android-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.14.0
          cache: npm
      - run: npm ci
      - name: Generate Android project
        run: npx expo prebuild --platform android --no-install
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Build E2E APK
        working-directory: android
        run: ./gradlew :app:assembleDebug
      - name: Install Maestro
        env:
          MAESTRO_VERSION: 1.40.3
        run: curl -Ls https://get.maestro.mobile.dev | bash
      - name: Enable KVM acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run critical journeys on Android 15
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          disable-linux-hw-accel: false
          script: |
            set -e
            CI=1 npx expo start --dev-client --localhost > "$RUNNER_TEMP/metro.log" 2>&1 &
            METRO_PID=$!
            trap 'kill "$METRO_PID" 2>/dev/null || true' EXIT
            for attempt in {1..60}; do
              if curl -fsS http://127.0.0.1:8081/status | grep -q 'packager-status:running'; then
                break
              fi
              if [[ "$attempt" -eq 60 ]]; then
                cat "$RUNNER_TEMP/metro.log"
                exit 1
              fi
              sleep 1
            done
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            adb reverse tcp:8081 tcp:8081
            node scripts/create-upgrade-fixture.mjs "$RUNNER_TEMP/gastos-v27.db"
            adb shell pm clear com.vitoco18.FinniApp
            adb push "$RUNNER_TEMP/gastos-v27.db" /data/local/tmp/gastos.db
            adb shell run-as com.vitoco18.FinniApp mkdir -p files/SQLite
            adb shell run-as com.vitoco18.FinniApp cp /data/local/tmp/gastos.db files/SQLite/gastos.db
            $HOME/.maestro/bin/maestro test .maestro/upgrade-from-v27.yml
            $HOME/.maestro/bin/maestro test .maestro/onboarding-full.yml .maestro/smoke-financial.yml .maestro/debt-partial-payment.yml .maestro/credit-installment-reconciliation.yml .maestro/settings-and-localization.yml .maestro/google-drive-boundary.yml
            touch "$RUNNER_TEMP/finniapp-maestro-passed"
      - name: Verify critical journeys completed
        if: always()
        run: |
          if [[ ! -f "$RUNNER_TEMP/finniapp-maestro-passed" ]]; then
            echo "::error::Maestro or the Android emulator failed before all critical journeys completed."
            exit 1
          fi
      - name: Upload Maestro evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: maestro-android-${{ github.run_id }}
          path: |
            ~/.maestro/tests
            ${{ runner.temp }}/metro.log
          if-no-files-found: ignore
          retention-days: 14
