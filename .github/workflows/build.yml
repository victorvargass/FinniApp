name: EAS Build

on:
  workflow_dispatch:
    inputs:
      profile:
        description: Perfil de EAS Build
        required: true
        default: preview
        type: choice
        options: [preview, production]

jobs:
  e2e:
    uses: ./.github/workflows/e2e-android.yml

  build:
    needs: e2e
    runs-on: ubuntu-latest
    environment: ${{ inputs.profile }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.14.0
          cache: npm
      - run: npm ci
      - run: npm run check
      - uses: expo/expo-github-action@v8
        with:
          eas-version: 16.27.0
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Run gated EAS workflow
        run: |
          if [ "${{ inputs.profile }}" = "production" ]; then
            eas workflow:run .eas/workflows/create-production-android-build.yml --non-interactive
          else
            eas workflow:run .eas/workflows/create-preview-android-build.yml --non-interactive
          fi
