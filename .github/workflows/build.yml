name: EAS Build

on:
  workflow_dispatch:
    inputs:
      profile:
        description: Perfil de EAS Build
        required: true
        default: preview
        type: choice
        options: [preview, production]

jobs:
  build:
    runs-on: ubuntu-latest
    environment: ${{ inputs.profile }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: npm
      - run: npm ci
      - run: npm run check
      - uses: expo/expo-github-action@v8
        with:
          eas-version: 16.27.0
          token: ${{ secrets.EXPO_TOKEN }}
      - run: eas build --platform android --profile ${{ inputs.profile }} --non-interactive --no-wait
